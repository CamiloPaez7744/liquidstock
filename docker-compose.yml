services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liquistock
    ports:
      # Puerto 5436 en host para evitar colisión con otros clusters locales (5432-5435).
      - "127.0.0.1:5436:5432"
    volumes:
      - liquistock_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liquistock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  liquistock_pg_data:

